# ------ root_path/dataset_name ------
root_path: './data'


# ------ Load Cache and Features ------
load_cache: False
load_pre_feat: False

# load_cache: True
# load_pre_feat: True


# ------ Hyperparamters ------
search_hp: True
# search_hp: False

search_scale: [12, 10]
search_step: [200, 20]

init_beta: 1
init_alpha: 1.17


# ------ Basic Config ------
dataset: 'sun397'
shots: 16
backbone: ['ViT-B/16']

lr: 0.001
augment_epoch: 10
train_epoch: 20
# Shared entry-point settings
preset_id: 'sun397'
wandb_project: 'ICML_SUN'
script_defaults:
  batch_size: 4
  lora_r: 8
num_workers: 4
eval_batch_size: 64
