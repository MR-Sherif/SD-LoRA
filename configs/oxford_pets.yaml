# ------ root_path/dataset_name ------
root_path: './data'


# ------ Load Cache and Features ------
load_cache: False
load_pre_feat: False

# load_cache: True
# load_pre_feat: True


# ------ Hyperparamters ------
search_hp: True
# search_hp: False

search_scale: [7, 3]
search_step: [200, 20]

init_beta: 1
init_alpha: 1.17


# ------ Basic Config ------
dataset: 'oxford_pets'
shots: 16
backbone: ['ViT-B/16']

lr: 0.001
augment_epoch: 10
train_epoch: 50
# Shared entry-point settings
preset_id: 'oxford_pets'
wandb_project: 'ICML_OxfordPets'
script_defaults:
  batch_size: 4
  lora_r: 4
num_workers: 4
eval_batch_size: 64
